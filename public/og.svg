<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#11161f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- grid streets -->
  <g stroke="#1e2733" stroke-width="2">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="350" y1="0" x2="350" y2="630"/>
    <line x1="550" y1="0" x2="550" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="950" y1="0" x2="950" y2="630"/>
    <line x1="1150" y1="0" x2="1150" y2="630"/>
  </g>

  <!-- highlighted gap cells -->
  <rect x="752" y="122" width="196" height="116" fill="#4ade80" opacity="0.18"/>
  <rect x="952" y="362" width="196" height="116" fill="#4ade80" opacity="0.28"/>
  <rect x="552" y="482" width="196" height="116" fill="#4ade80" opacity="0.14"/>

  <!-- data bars -->
  <g transform="translate(905 400)">
    <rect x="0" y="60" width="34" height="60" rx="3" fill="url(#bar)" opacity="0.7"/>
    <rect x="48" y="20" width="34" height="100" rx="3" fill="url(#bar)" opacity="0.85"/>
    <rect x="96" y="-20" width="34" height="140" rx="3" fill="url(#bar)"/>
    <rect x="144" y="40" width="34" height="80" rx="3" fill="url(#bar)" opacity="0.75"/>
  </g>

  <rect x="84" y="170" width="90" height="6" rx="3" fill="#4ade80"/>
  <text x="84" y="150" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="600" fill="#4ade80" letter-spacing="4">NEW YORK CITY</text>
  <text x="80" y="300" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="96" fill="#f5f7fa">Gap Finder NYC</text>
  <text x="84" y="370" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="40" fill="#aebac9">Find underserved neighborhoods and</text>
  <text x="84" y="420" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="40" fill="#aebac9">business gaps across NYC</text>

  <text x="84" y="555" font-family="Inter, sans-serif" font-size="30" fill="#5e6b7d">gap-finder-nyc.vercel.app</text>
</svg>
